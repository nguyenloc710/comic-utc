<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/studio}">
<head>
    <title th:text="#{studio.dashboard.title}">Tổng quan</title>
</head>
<body>
<h1 layout:fragment="heading" class="h5 mb-0 text-truncate" th:text="#{studio.dashboard.title}">Tổng quan</h1>
<div layout:fragment="content">
    <h2 class="h5 mb-3" th:text="#{studio.dashboard.welcome(${currentUser.displayName})}">Xin chào</h2>
    <div th:replace="~{fragments/studio :: overviewCards(${overview})}"></div>
    <div class="card border-0 shadow-sm">
        <div class="card-body d-flex flex-wrap gap-2">
            <a class="btn btn-primary" th:href="@{/studio/stories/new}">
                <i class="bi bi-plus-lg"></i> <span th:text="#{studio.stories.create}">Thêm truyện</span>
            </a>
            <a class="btn btn-outline-secondary" th:href="@{/studio/stories}">
                <i class="bi bi-journals"></i> <span th:text="#{nav.studio.stories}">Truyện của tôi</span>
            </a>
            <a class="btn btn-outline-secondary" th:href="@{/studio/stats}">
                <i class="bi bi-graph-up"></i> <span th:text="#{nav.studio.stats}">Thống kê</span>
            </a>
        </div>
    </div>
</div>
</body>
</html>
