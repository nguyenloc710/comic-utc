<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/site}">
<head>
    <title th:text="#{home.title}">Trang chủ</title>
</head>
<body>
<div layout:fragment="content">
    <!-- Chỉ người đã đăng nhập và đã đọc ít nhất một chương mới có khối này -->
    <section class="mb-5" th:unless="${continueReading.isEmpty()}">
        <div th:replace="~{fragments/story :: sectionHeader(#{home.section.continue}, @{/me/history})}"></div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
            <div class="col" th:each="item : ${continueReading}">
                <div th:replace="~{fragments/history :: item(${item})}"></div>
            </div>
        </div>
    </section>

    <section class="mb-5">
        <div th:replace="~{fragments/story :: sectionHeader(#{home.section.latest}, @{/stories})}"></div>
        <div th:replace="~{fragments/story :: grid(${latestStories})}"></div>
        <p class="text-center text-secondary py-5 mb-0" th:if="${latestStories.isEmpty()}" th:text="#{home.empty}">
            Kho truyện chưa có truyện nào.
        </p>
    </section>

    <section class="mb-5" th:unless="${weeklyTopStories.isEmpty()}">
        <div th:replace="~{fragments/story :: sectionHeader(#{home.section.weekly.top}, @{/rankings})}"></div>
        <div th:replace="~{fragments/story :: grid(${weeklyTopStories})}"></div>
    </section>

    <section class="mb-5" th:unless="${newestStories.isEmpty()}">
        <div th:replace="~{fragments/story :: sectionHeader(#{home.section.newest}, @{/stories(sort='NEWEST')})}"></div>
        <div th:replace="~{fragments/story :: grid(${newestStories})}"></div>
    </section>

    <section th:unless="${completedStories.isEmpty()}">
        <div th:replace="~{fragments/story :: sectionHeader(#{home.section.completed}, @{/stories(status='COMPLETED')})}"></div>
        <div th:replace="~{fragments/story :: grid(${completedStories})}"></div>
    </section>
</div>
</body>
</html>
