<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/site}">
<head>
    <title th:text="#{login.title}">Đăng nhập</title>
</head>
<body>
<div layout:fragment="content">
    <div class="auth-card card border-0 shadow-sm mx-auto">
        <div class="card-body p-4">
            <h1 class="h4 fw-bold mb-1" th:text="#{login.title}">Đăng nhập</h1>
            <p class="text-secondary small" th:text="#{login.subtitle}">Đăng nhập để theo dõi truyện.</p>

            <!-- loginErrorKey do AuthController đổi từ mã lỗi trên URL, không lấy thẳng tham số URL làm khóa -->
            <div class="alert alert-danger d-flex align-items-center gap-2" role="alert" th:if="${loginErrorKey != null}">
                <i class="bi bi-exclamation-circle-fill"></i> <span th:text="#{${loginErrorKey}}">Sai thông tin</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label" th:text="#{login.username}">Tên đăng nhập hoặc email</label>
                    <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label" th:text="#{login.password}">Mật khẩu</label>
                    <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" th:text="#{login.submit}">Đăng nhập</button>
            </form>

            <p class="text-center small mt-3 mb-0">
                <span th:text="#{login.no.account}">Chưa có tài khoản?</span>
                <a th:href="@{/register}" th:text="#{nav.register}">Đăng ký</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
