<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Thời điểm (Instant lưu UTC) hiển thị theo giờ Việt Nam; rỗng thì hiện gạch ngang. -->
<th:block th:fragment="datetime(value)">
    <time th:if="${value != null}" th:datetime="${value}"
          th:text="${#temporals.format(value, #messages.msg('format.datetime'), displayZone)}">01/01/2026 08:00</time>
    <span th:if="${value == null}" class="text-secondary" th:text="#{common.none}">—</span>
</th:block>

<!--
  Ảnh đại diện: có ảnh thì hiện ảnh, chưa có thì hiện chữ cái đầu của tên.
  sizeClass: '' (cỡ thường, dùng ở menu) hoặc 'user-avatar-lg' (trang hồ sơ)
-->
<th:block th:fragment="avatar(url, initials, sizeClass)">
    <img th:if="${url != null}" th:src="${url}" class="user-avatar" th:classappend="${sizeClass}" alt="">
    <span th:if="${url == null}" class="user-avatar" th:classappend="${sizeClass}" th:text="${initials}">MA</span>
</th:block>
</body>
</html>
