<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Phân trang cho một PageResponse. Link giữ nguyên bộ lọc đang chọn nhờ requestPath và filterQuery
  do GlobalModelAttributes cung cấp, nên trang nào cũng dùng lại được mà không phải truyền URL.
-->
<nav th:fragment="pager(page)" th:if="${page != null and page.totalPages > 1}" th:aria-label="#{pagination.label}">
    <ul class="pagination justify-content-center align-items-center gap-2 my-4">
        <li class="page-item" th:classappend="${!page.hasPrevious} ? 'disabled'">
            <a class="page-link rounded" th:href="${requestPath + '?' + filterQuery + 'page=' + (page.page - 1)}"
               th:aria-label="#{pagination.previous}"><i class="bi bi-chevron-left"></i></a>
        </li>
        <li class="page-item disabled">
            <span class="page-link border-0 bg-transparent text-body"
                  th:text="#{pagination.info(${page.displayPage()}, ${page.totalPages})}">Trang 1 / 5</span>
        </li>
        <li class="page-item" th:classappend="${!page.hasNext} ? 'disabled'">
            <a class="page-link rounded" th:href="${requestPath + '?' + filterQuery + 'page=' + (page.page + 1)}"
               th:aria-label="#{pagination.next}"><i class="bi bi-chevron-right"></i></a>
        </li>
    </ul>
</nav>
</body>
</html>
