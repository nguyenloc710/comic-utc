<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Thẻ meta và stylesheet dùng chung cho mọi layout. CSRF token đặt ở meta để App.fetchJson gắn vào header. -->
    <th:block th:fragment="assets">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
        <link rel="stylesheet" th:href="@{/css/app.css}">
    </th:block>
</head>
<body>
<!-- Script dùng chung, đặt cuối body của mọi layout -->
<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:if="${currentUser != null}" th:src="@{/js/notifications.js}"></script>
</th:block>
</body>
</html>
