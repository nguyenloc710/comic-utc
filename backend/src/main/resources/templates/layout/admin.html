<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title layout:title-pattern="$CONTENT_TITLE – $LAYOUT_TITLE" th:text="#{app.subtitle.admin}">Quản trị</title>
    <th:block th:replace="~{fragments/head :: assets}"></th:block>
</head>
<body class="console-body">
<!--
  Layout khu vực quản trị. Cùng khung với studio (xem ghi chú về hai lớp phần tử ở layout/studio.html)
  nhưng sidebar tối màu để không nhầm khu vực đang thao tác.
-->
<div class="d-flex min-vh-100">
    <aside class="console-sidebar console-sidebar-admin">
        <div class="console-sidebar-panel offcanvas-lg offcanvas-start" tabindex="-1" id="consoleSidebar">
            <a class="console-brand" th:href="@{/admin}">
                <i class="bi bi-shield-lock"></i>
                <span>
                    <span class="d-block fw-bold" th:text="#{app.name}">Comic UTC</span>
                    <span class="d-block small opacity-75" th:text="#{app.subtitle.admin}">Quản trị</span>
                </span>
            </a>
            <nav class="nav flex-column console-nav">
                <a class="nav-link" th:href="@{/admin}" th:classappend="${requestPath == '/admin'} ? 'active'">
                    <i class="bi bi-speedometer2"></i> <span th:text="#{nav.overview}">Tổng quan</span>
                </a>
                <a class="nav-link" th:href="@{/admin/author-requests}" th:classappend="${#strings.startsWith(requestPath, '/admin/author-requests')} ? 'active'">
                    <i class="bi bi-person-check"></i> <span th:text="#{nav.author.requests}">Yêu cầu tác giả</span>
                </a>
                <a class="nav-link" th:href="@{/admin/users}" th:classappend="${#strings.startsWith(requestPath, '/admin/users')} ? 'active'">
                    <i class="bi bi-people"></i> <span th:text="#{nav.users}">Người dùng</span>
                </a>
                <a class="nav-link" th:href="@{/admin/genres}" th:classappend="${#strings.startsWith(requestPath, '/admin/genres')} ? 'active'">
                    <i class="bi bi-tags"></i> <span th:text="#{nav.genres}">Thể loại</span>
                </a>
                <a class="nav-link" th:href="@{/admin/stories}" th:classappend="${#strings.startsWith(requestPath, '/admin/stories')} ? 'active'">
                    <i class="bi bi-journals"></i> <span th:text="#{nav.admin.stories}">Truyện</span>
                </a>
                <a class="nav-link" th:href="@{/admin/comments}" th:classappend="${#strings.startsWith(requestPath, '/admin/comments')} ? 'active'">
                    <i class="bi bi-chat-dots"></i> <span th:text="#{nav.admin.comments}">Bình luận</span>
                </a>
                <a class="nav-link" th:href="@{/admin/reports}" th:classappend="${#strings.startsWith(requestPath, '/admin/reports')} ? 'active'">
                    <i class="bi bi-flag"></i> <span th:text="#{nav.admin.reports}">Báo cáo vi phạm</span>
                </a>
                <a class="nav-link" th:href="@{/admin/settings}" th:classappend="${#strings.startsWith(requestPath, '/admin/settings')} ? 'active'">
                    <i class="bi bi-sliders"></i> <span th:text="#{nav.admin.settings}">Tham số</span>
                </a>
                <a class="nav-link" th:href="@{/admin/audit-logs}" th:classappend="${#strings.startsWith(requestPath, '/admin/audit-logs')} ? 'active'">
                    <i class="bi bi-journal-text"></i> <span th:text="#{nav.admin.audit.logs}">Nhật ký</span>
                </a>
                <a class="nav-link mt-auto" th:href="@{/}">
                    <i class="bi bi-arrow-left-circle"></i> <span th:text="#{nav.back.to.site}">Về trang đọc truyện</span>
                </a>
            </nav>
        </div>
    </aside>

    <div class="flex-grow-1 d-flex flex-column console-main">
        <header class="console-topbar">
            <button class="btn btn-outline-secondary btn-sm d-lg-none" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#consoleSidebar" aria-controls="consoleSidebar" th:aria-label="#{nav.toggle.menu}">
                <i class="bi bi-list"></i>
            </button>
            <h1 class="h5 mb-0 text-truncate" layout:fragment="heading">Tiêu đề trang</h1>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a th:replace="~{fragments/user-menu :: bell}"></a>
                <div th:replace="~{fragments/user-menu :: menu}"></div>
            </div>
        </header>
        <main class="console-content">
            <div th:replace="~{fragments/flash :: flash}"></div>
            <div layout:fragment="content"></div>
        </main>
    </div>
</div>

<th:block th:replace="~{fragments/head :: scripts}"></th:block>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
