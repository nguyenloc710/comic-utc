<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Trang lỗi đứng riêng, không dùng layout: nó phải hiển thị được cả khi lỗi phát sinh trong chính layout. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{error.page.title}">Có lỗi xảy ra</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="site-body">
<div class="min-vh-100 d-flex align-items-center justify-content-center p-4">
    <div class="text-center">
        <div class="error-status" th:text="${errorStatus != null} ? ${errorStatus} : '500'">500</div>
        <h1 class="h4" th:text="#{error.page.title}">Có lỗi xảy ra</h1>
        <p class="text-secondary" th:text="${errorMessage}">Thông báo lỗi</p>
        <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> <span th:text="#{error.page.back}">Về trang chủ</span></a>
    </div>
</div>
</body>
</html>
