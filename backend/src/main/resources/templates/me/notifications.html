<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/site}">
<head>
    <title th:text="#{notification.title}">Thông báo</title>
</head>
<body>
<div layout:fragment="content">
    <div class="profile-page mx-auto">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0" th:text="#{notification.title}">Thông báo</h1>
            <form th:action="@{/me/notifications/read-all}" method="post" th:unless="${page.isEmpty()}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-check2-all"></i> <span th:text="#{notification.read.all}">Đánh dấu đã đọc tất cả</span>
                </button>
            </form>
        </div>

        <p class="text-center text-secondary py-5" th:if="${page.isEmpty()}" th:text="#{notification.empty}">Chưa có thông báo</p>

        <div class="card border-0 shadow-sm" th:unless="${page.isEmpty()}">
            <ul class="list-group list-group-flush">
                <li class="list-group-item p-0" th:each="notification : ${page.content}">
                    <!-- Mỗi thông báo là một form POST: mở thông báo có đổi dữ liệu (đánh dấu đã đọc) nên không dùng link GET -->
                    <form th:action="@{/me/notifications/{id}/open(id=${notification.id})}" method="post">
                        <button type="submit" class="notification-item" th:classappend="${!notification.read} ? 'notification-unread'">
                            <i class="bi" th:classappend="${notification.type.name() == 'NEW_CHAPTER'} ? 'bi-book' : 'bi-bell'"></i>
                            <span class="flex-grow-1">
                                <span class="d-block" th:text="${notification.message}">Nội dung thông báo</span>
                                <span class="small text-secondary fw-normal">
                                    <th:block th:replace="~{fragments/display :: datetime(${notification.createdAt})}"></th:block>
                                </span>
                            </span>
                        </button>
                    </form>
                </li>
            </ul>
        </div>
        <nav th:replace="~{fragments/pagination :: pager(${page})}"></nav>
    </div>
</div>
</body>
</html>
