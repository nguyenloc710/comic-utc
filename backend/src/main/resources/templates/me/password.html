<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/site}">
<head>
    <title th:text="#{password.title}">Đổi mật khẩu</title>
</head>
<body>
<div layout:fragment="content">
    <div class="auth-card card border-0 shadow-sm mx-auto">
        <div class="card-body p-4">
            <h1 class="h4 fw-bold mb-3" th:text="#{password.title}">Đổi mật khẩu</h1>
            <form th:action="@{/me/password}" th:object="${form}" method="post" novalidate>
                <div th:replace="~{fragments/form :: input('currentPassword', #{password.current}, 'password', 'current-password', null)}"></div>
                <div th:replace="~{fragments/form :: input('newPassword', #{password.new}, 'password', 'new-password', null)}"></div>
                <div th:replace="~{fragments/form :: input('confirmPassword', #{password.confirm}, 'password', 'new-password', null)}"></div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{password.submit}">Đổi mật khẩu</button>
                    <a class="btn btn-outline-secondary" th:href="@{/me/profile}" th:text="#{common.cancel}">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
