# Môi trường thật: thông tin nhạy cảm đọc từ biến môi trường, không nạp dữ liệu demo.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      pool-name: comic-prod-pool

  flyway:
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

logging:
  level:
    root: INFO
    vn.edu.utc.comic: INFO
