# Môi trường phát triển: MySQL chạy bằng Docker (cổng 3308), log SQL để soi N+1, nạp dữ liệu demo.
spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3308}/${MYSQL_DATABASE:comic_utc}?serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:comic}
    password: ${MYSQL_PASSWORD:comic_local_pwd}
    hikari:
      maximum-pool-size: 10
      pool-name: comic-dev-pool

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Chỉ ở dev mới nạp dữ liệu demo (thư mục db/demo)
    locations: classpath:db/migration,classpath:db/demo
    # Dữ liệu demo đánh số từ V100 để luôn chạy sau phần lược đồ. Hệ quả: máy dev nào đã nạp demo
    # rồi thì mọi migration lược đồ mới (V3, V4...) đều bị coi là "ngoài thứ tự" và Flyway chặn.
    # Bật ở đây chứ không ở prod: prod chỉ nạp db/migration nên thứ tự luôn tăng dần tự nhiên.
    out-of-order: true

  thymeleaf:
    cache: false

app:
  storage:
    # Ảnh bìa và trang truyện của dữ liệu demo nằm sẵn trong classpath, phục vụ chung dưới /media/**
    demo-media-location: classpath:/demo-media/

logging:
  level:
    vn.edu.utc.comic: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO
