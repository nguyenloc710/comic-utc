# Mỗi lần đẩy code hoặc mở pull request: chạy toàn bộ test (Testcontainers dùng Docker có sẵn trên runner)
# rồi thử dựng image Docker để chắc Dockerfile vẫn đúng. Không gọi LLM thật: không có AI_API_KEY thì
# SpringAiToolCallingSmokeTest tự bỏ qua.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test và đo độ phủ
        run: ./mvnw -B verify

      - name: Lưu báo cáo test và JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Dựng image
        run: docker build -t comic-utc:ci backend
